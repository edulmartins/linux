%YAML 1.2
---
$id: http://devicetree.org/schemas/clock/apple,t8010-touch-clock.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Apple T7000/T8010 touchscreen clock controller

maintainers:
  - Paul Praschl <praschlpaul@g-p.at>

description:
  The T7000 and T8010 PMGR contain a gate and integer divider for the
  reference clock consumed by the touchscreen controller. The S8000 PMGR has
  the same block at the same offset; the iPad 5 N1 touchscreen runs it at
  32768 Hz. So has the T8015 PMGR, whose iPhone X touchscreen runs it at
  24 MHz.

properties:
  compatible:
    oneOf:
      - enum:
          - apple,t7000-touch-clock
          - apple,t8010-touch-clock
      - items:
          - enum:
              - apple,s8000-touch-clock
              - apple,t8015-touch-clock
          - const: apple,t8010-touch-clock

  reg:
    maxItems: 1

  clocks:
    maxItems: 1

  '#clock-cells':
    const: 0

  clock-output-names:
    maxItems: 1

  clock-frequency:
    description: Target clock rate in Hz

required:
  - compatible
  - reg
  - clocks
  - '#clock-cells'
  - clock-frequency

additionalProperties: false

examples:
  - |
    clock-controller@78000 {
        compatible = "apple,t8010-touch-clock";
        reg = <0x78000 0x8>;
        #clock-cells = <0>;
        clocks = <&clkref>;
        clock-output-names = "touchclk";
        clock-frequency = <24000000>;
    };
...
